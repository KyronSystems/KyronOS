set timeout=3
set default=0
insmod all_video
insmod jpeg
insmod multiboot2
insmod search
insmod search_fs_file
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
search --no-floppy --file --set=root /boot/kyronos.kernel
if [ -f /bg.jpg ]; then
    background_image /bg.jpg
fi
menuentry "KyronOS" {
    if multiboot2 /boot/kyronos.kernel; then
        boot
    else
        echo "KyronOS kernel load failed; check the ISO path and Multiboot2 support."
    fi
}
menuentry "Update installed KyronOS" {
    if multiboot2 /boot/kyronos.kernel; then
        module2 /boot/kyronos.kernel kyron-update
        boot
    else
        echo "KyronOS update kernel load failed; check the ISO kernel file."
    fi
}
